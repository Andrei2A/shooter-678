    hearSound(playerX, playerZ, sound) {
        if (this.state === ENEMY_STATE.DEAD) return;
        if (this.state === ENEMY_STATE.IDLE) {
            this.state = ENEMY_STATE.ALERT;
            this.stateTimer = 0;
            if (sound) sound.playEnemyAlert();
        }
    }

    takeDamage(sound, impulseDir, colliders) {
        if (this.state === ENEMY_STATE.DEAD) return;
        this.hp--;

        const dir = impulseDir || new THREE.Vector3(0, 0, -1);

        if (this.hp <= 0) {
            this.state = ENEMY_STATE.DEAD;
            this.stateTimer = 0;
            this.settleTimer = 0;
            if (sound) sound.playEnemyDeath();
            if (this.ragdollActive && this.ragdoll) {
                // Second hit — extra impulse to already-ragdolled body
                this.ragdoll.applyHitImpulse(dir, 6);
            } else {
                // Activate ragdoll for instant death (e.g. if first shot kills)
                this.activateRagdoll(dir, colliders);
            }
            return true; // killed
        } else {
            this.state = ENEMY_STATE.WOUNDED;
            this.stateTimer = 0;
            this.woundFallProgress = 0;
            this.woundWritheTimer = 0;
            if (sound) sound.playEnemyPain();
            // Activate ragdoll on first hit
            this.activateRagdoll(dir, colliders);
            return false;
        }
    }

    canSeePlayer(playerPos, doorOpen) {
        // Can only see player if the apartment door is open
        if (!doorOpen) return false;
        const enemyPos = new THREE.Vector3(
            this.group.position.x,
            1.5,
            this.group.position.z
        );
        const dist = enemyPos.distanceTo(playerPos);
        return dist < 15;
    }

    // Resolve enemy position against wall colliders
    resolveCollisions(colliders) {
        const px = this.group.position.x;
        const pz = this.group.position.z;
        let nx = px, nz = pz;
        for (let iter = 0; iter < 3; iter++) {
            for (const col of colliders) {
                if (!col) continue;
                if (col.intersectsSphere(nx, nz, this.radius)) {
                    const push = col.resolve(nx, nz, this.radius);
                    if (push) { nx += push.x; nz += push.z; }
                }
            }
        }
        this.group.position.x = nx;
        this.group.position.z = nz;
    }

    update(dt, playerPos, game, doorOpen, colliders) {
        this.stateTimer += dt;

        // group stays on the floor
        this.group.position.y = 0;
        this.group.rotation.z = 0;
        this.group.rotation.x = 0;

        // Face player (except dead/wounded)
        if (this.state !== ENEMY_STATE.DEAD && this.state !== ENEMY_STATE.WOUNDED
            && (doorOpen || this.state === ENEMY_STATE.RUSHING)) {
            const dx = playerPos.x - this.group.position.x;
            const dz = playerPos.z - this.group.position.z;
            const angle = Math.atan2(dx, dz);
            this.group.rotation.y = angle;
        }

        // Reset body pivot for standing states
        if (this.state !== ENEMY_STATE.DEAD && this.state !== ENEMY_STATE.WOUNDED) {
            this.body.rotation.set(0, 0, 0);
        }

        switch (this.state) {
            case ENEMY_STATE.IDLE:
                break;

            case ENEMY_STATE.ALERT:
                if (this.stateTimer > 1.0 && this.canSeePlayer(playerPos, doorOpen)) {
                    this.state = ENEMY_STATE.ATTACKING;
                    this.stateTimer = 0;
                    this.shootTimer = 0;
                }
                this.rightArm.rotation.x = -0.5;
                this.weapon.position.z = -0.25;
                break;

            case ENEMY_STATE.ATTACKING:
                this.rightArm.rotation.x = -1.2;
                this.weapon.position.z = -0.35;
                this.weapon.position.y = 1.3;

                this.shootTimer += dt;
                if (this.shootTimer > 1.5 && !this.hasShot) {
                    this.hasShot = true;
                    this.shootAtPlayer(playerPos, game);
                }
                if (this.shootTimer > 2.5) {
                    this.shootTimer = 0;
                    this.hasShot = false;
                    if (Math.random() < 0.4) {
                        this.state = ENEMY_STATE.RUSHING;
                        this.stateTimer = 0;
                    }
                }
                break;

            case ENEMY_STATE.RUSHING: {
                // Move toward player with wall collision
                const rdx = playerPos.x - this.group.position.x;
                const rdz = playerPos.z - this.group.position.z;
                const rdist = Math.sqrt(rdx * rdx + rdz * rdz);
                if (rdist > 1.5) {
                    this.group.position.x += (rdx / rdist) * this.rushSpeed * dt;
                    this.group.position.z += (rdz / rdist) * this.rushSpeed * dt;
                    // Collide with walls
                    if (colliders) this.resolveCollisions(colliders);
                    // Leg animation
                    const walkPhase = this.stateTimer * 8;
                    this.leftLeg.rotation.x = Math.sin(walkPhase) * 0.5;
                    this.rightLeg.rotation.x = -Math.sin(walkPhase) * 0.5;
                }
                this.shootTimer += dt;
                if (this.shootTimer > 2.0) {
                    this.state = ENEMY_STATE.ATTACKING;
                    this.stateTimer = 0;
                    this.shootTimer = 0;
                    this.hasShot = false;
                }
                break;
            }

            case ENEMY_STATE.WOUNDED: {
                // Ragdoll-driven fall and writhing
                if (this.ragdollActive && this.ragdoll) {
                    this.ragdoll.update(dt, colliders);
                    this.syncMeshToRagdoll();

                    // Writhing impulses — periodic small nudges to limbs
                    this.woundWritheTimer += dt;
                    if (this.woundWritheTimer > 0.6 && this.stateTimer > 0.8) {
                        this.woundWritheTimer = 0;
                        const rp = this.ragdoll.particles;
                        // Small random writhe on hands/head
                        const wx = (Math.random() - 0.5) * 1.5;
                        const wz = (Math.random() - 0.5) * 1.5;
                        rp.lHand.applyImpulse(wx, 0.8, wz);
                        rp.rHand.applyImpulse(-wx, 0.5, -wz);
                        rp.head.applyImpulse(wx * 0.3, 0.3, wz * 0.3);
                        // Occasional leg twitch
                        if (Math.random() < 0.4) {
                            rp.lFoot.applyImpulse(0, 0.5, (Math.random() - 0.5));
                        }
                    }

                    // Gradually settle after initial fall
                    if (this.stateTimer > 2.0) {
                        this.ragdoll.settle(0.02);
                    }
                }

                this.shootTimer += dt;
                if (this.shootTimer > 2.5 && !this.hasShot) {
                    this.hasShot = true;
                    this.shootAtPlayer(playerPos, game);
                }
                if (this.shootTimer > 4.0) {
                    this.shootTimer = 0;
                    this.hasShot = false;
                }
                break;
            }

            case ENEMY_STATE.DEAD: {
                // Ragdoll-driven death
                if (this.ragdollActive && this.ragdoll) {
                    this.ragdoll.update(dt, colliders);
                    this.syncMeshToRagdoll();

                    // Settle the body over time
                    this.settleTimer += dt;
                    if (this.settleTimer > 0.5) {
                        this.ragdoll.settle(0.04);
                    }
                    if (this.settleTimer > 2.0) {
                        this.ragdoll.settle(0.1);
                    }
                    // Death twitches in the first second
                    if (this.stateTimer < 1.0) {
                        const rp = this.ragdoll.particles;
                        const tw = (1 - this.stateTimer) * 0.3;
                        if (Math.random() < 0.3) {
                            rp.lHand.applyImpulse(
                                (Math.random() - 0.5) * tw,
                                Math.random() * tw * 0.5,
                                (Math.random() - 0.5) * tw
                            );
                            rp.rHand.applyImpulse(
                                (Math.random() - 0.5) * tw,
                                Math.random() * tw * 0.5,
                                (Math.random() - 0.5) * tw
                            );
                        }
                    }
                }
                break;
            }
        }
    }

    shootAtPlayer(playerPos, game) {
        game.sound.playEnemyShot();

        // Accuracy based on state
        const accuracy = this.state === ENEMY_STATE.WOUNDED ? 0.25 : 0.4;
        if (Math.random() < accuracy) {
            game.damagePlayer();
        }
    }

    getPosition() {
        return this.group.position;
    }

    getBoundingBox() {
        const p = this.group.position;
        return new AABB(p.x - 0.25, p.z - 0.15, p.x + 0.25, p.z + 0.15, 0, 1.9);
    }
}

// ============================================================
// EnemyManager
// ============================================================
class EnemyManager {
    constructor(scene, doorPositions) {
        this.enemies = [];
        this.killCount = 0;

        for (let i = 0; i < doorPositions.length; i++) {
            const dp = doorPositions[i];
            // Spawn enemy inside apartment
            const aptCenterX = dp.x + dp.side * 3;
            const aptCenterZ = dp.z + (Math.random() - 0.5) * 2;
            const enemy = new Enemy(scene, aptCenterX, aptCenterZ, dp.side, i);
            this.enemies.push(enemy);
        }
    }

    update(dt, playerPos, game, doors, colliders) {
        for (let i = 0; i < this.enemies.length; i++) {
            const doorOpen = doors[i] ? doors[i].isOpen : false;
            this.enemies[i].update(dt, playerPos, game, doorOpen, colliders);
        }
    }

    notifySound(playerX, playerZ, radius, sound) {
        for (const enemy of this.enemies) {
            const dx = enemy.group.position.x - playerX;
            const dz = enemy.group.position.z - playerZ;
            if (Math.sqrt(dx * dx + dz * dz) < radius) {
                enemy.hearSound(playerX, playerZ, sound);
            }
        }
    }

    checkHits(raycaster) {
        const hits = [];
        for (const enemy of this.enemies) {
            if (enemy.state === ENEMY_STATE.DEAD) continue;
            const p = enemy.group.position;
            let box;
            if (enemy.ragdollActive) {
                // Ragdolled enemy is on the ground — wider, shorter bounding box
                box = new THREE.Box3(
                    new THREE.Vector3(p.x - 0.8, p.y, p.z - 0.8),
                    new THREE.Vector3(p.x + 0.8, p.y + 0.6, p.z + 0.8)
                );
            } else {
                // Standing enemy
                box = new THREE.Box3(
                    new THREE.Vector3(p.x - 0.3, p.y, p.z - 0.2),
                    new THREE.Vector3(p.x + 0.3, p.y + 1.9, p.z + 0.2)
                );
            }
            if (raycaster.ray.intersectsBox(box)) {
                const origin = raycaster.ray.origin;
                const cy = enemy.ragdollActive ? 0.3 : 1.0;
                const dist = origin.distanceTo(new THREE.Vector3(p.x, p.y + cy, p.z));
                hits.push({ enemy, dist });
            }
        }
        hits.sort((a, b) => a.dist - b.dist);
        return hits;
    }
}

// ============================================================
// Player
// ============================================================
class Player {
    constructor(camera, input) {
        this.camera = camera;
        this.input = input;
        this.position = new THREE.Vector3(0, 1.6, 1);
        this.yaw = Math.PI; // Face +Z (down the corridor)
        this.pitch = 0;
        this.speed = 4;
        this.radius = 0.3;
        this.hp = 2;
        this.maxHp = 2;
        this.moveDir = new THREE.Vector3();

        // Camera bob
        this.bobTimer = 0;
        this.bobAmount = 0;
        this.isMoving = false;

        // Footstep
        this.footstepTimer = 0;

        camera.position.copy(this.position);
    }

    update(dt, colliders, sound) {
        if (!this.input.locked) return;

        const mouse = this.input.consumeMouse();
        const sensitivity = 0.002;
        this.yaw -= mouse.dx * sensitivity;
        this.pitch -= mouse.dy * sensitivity;
        this.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, this.pitch));

        // WASD movement - forward is where camera looks
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(
            new THREE.Quaternion().setFromEuler(new THREE.Euler(0, this.yaw, 0, 'YXZ'))
        );
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(
            new THREE.Quaternion().setFromEuler(new THREE.Euler(0, this.yaw, 0, 'YXZ'))
        );
        let worldX = 0, worldZ = 0;
        if (this.input.keys['KeyW']) { worldX += forward.x; worldZ += forward.z; }
        if (this.input.keys['KeyS']) { worldX -= forward.x; worldZ -= forward.z; }
        if (this.input.keys['KeyA']) { worldX -= right.x; worldZ -= right.z; }
        if (this.input.keys['KeyD']) { worldX += right.x; worldZ += right.z; }

        this.isMoving = worldX !== 0 || worldZ !== 0;

        if (this.isMoving) {
            const len = Math.sqrt(worldX * worldX + worldZ * worldZ);
            worldX /= len;
            worldZ /= len;

            let newX = this.position.x + worldX * this.speed * dt;
            let newZ = this.position.z + worldZ * this.speed * dt;

            // Collision resolution
            for (let iter = 0; iter < 3; iter++) {
                for (const col of colliders) {
                    if (!col) continue;
                    if (col.intersectsSphere(newX, newZ, this.radius)) {
                        const push = col.resolve(newX, newZ, this.radius);
                        if (push) {
                            newX += push.x;
                            newZ += push.z;
                        }
                    }
                }
            }

            this.position.x = newX;
            this.position.z = newZ;

            // Camera bob
            this.bobTimer += dt * 10;
            this.bobAmount = Math.sin(this.bobTimer) * 0.03;

            // Footsteps
            this.footstepTimer += dt;
            if (this.footstepTimer > 0.4) {
                this.footstepTimer = 0;
                if (sound) sound.playFootstep();
            }
        } else {
            this.bobAmount *= 0.9;
            this.bobTimer = 0;
        }

        // Update camera
        this.camera.position.set(
            this.position.x,
            this.position.y + this.bobAmount,
            this.position.z
        );

        const euler = new THREE.Euler(this.pitch, this.yaw, 0, 'YXZ');
        this.camera.quaternion.setFromEuler(euler);
    }

    getPosition3() {
        return new THREE.Vector3(this.position.x, 1.5, this.position.z);
    }
}

// ============================================================
// UIManager
// ============================================================
class UIManager {
    constructor() {
        this.crosshair = document.getElementById('crosshair');
        this.vignette = document.getElementById('vignette');
        this.bloodVignette = document.getElementById('bloodVignette');
        this.filmGrain = document.getElementById('filmGrain');
        this.interactionPrompt = document.getElementById('interactionPrompt');
        this.liveFeed = document.getElementById('liveFeed');
        this.killCounter = document.getElementById('killCounter');
        this.menuScreen = document.getElementById('menuScreen');
        this.deathScreen = document.getElementById('deathScreen');
        this.victoryScreen = document.getElementById('victoryScreen');
        this.screenShakeAmount = 0;
    }

    showGameUI() {
        this.crosshair.style.display = 'flex';
        this.vignette.style.display = 'block';
        this.filmGrain.style.display = 'block';
        this.liveFeed.style.display = 'flex';
        this.killCounter.style.display = 'block';
    }

    hideGameUI() {
        this.crosshair.style.display = 'none';
        this.vignette.style.display = 'none';
        this.filmGrain.style.display = 'none';
        this.liveFeed.style.display = 'none';
        this.killCounter.style.display = 'none';
        this.interactionPrompt.style.display = 'none';
    }

    showScreen(name) {
        this.menuScreen.style.display = 'none';
        this.deathScreen.style.display = 'none';
        this.victoryScreen.style.display = 'none';
        if (name === 'menu') this.menuScreen.style.display = 'flex';
        if (name === 'death') this.deathScreen.style.display = 'flex';
        if (name === 'victory') this.victoryScreen.style.display = 'flex';
    }

    hideAllScreens() {
        this.menuScreen.style.display = 'none';
        this.deathScreen.style.display = 'none';
        this.victoryScreen.style.display = 'none';
    }

    showInteraction(show) {
        this.interactionPrompt.style.display = show ? 'flex' : 'none';
    }

    setBloodVignette(amount) {
        this.bloodVignette.style.opacity = amount;
    }

    updateKillCounter(kills) {
        this.killCounter.textContent = `TARGETS: ${kills} / 10`;
    }

    screenShake(amount) {
        this.screenShakeAmount = amount;
    }

    updateShake(dt) {
        if (this.screenShakeAmount > 0.01) {
            this.screenShakeAmount *= Math.pow(0.01, dt);
            const ox = (Math.random() - 0.5) * this.screenShakeAmount * 10;
            const oy = (Math.random() - 0.5) * this.screenShakeAmount * 10;
            document.getElementById('gameCanvas').style.transform = `translate(${ox}px, ${oy}px)`;
        } else {
            this.screenShakeAmount = 0;
            document.getElementById('gameCanvas').style.transform = '';
        }
    }
}

// ============================================================
// Game - Master Controller
// ============================================================
const GAME_STATE = {
    MENU: 'MENU',
    PLAYING: 'PLAYING',
    DEAD: 'DEAD',
    VICTORY: 'VICTORY'
};

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.state = GAME_STATE.MENU;

        // Three.js setup
        this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = false;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.6;

        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x0a0806);

        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        this.scene.add(this.camera);

        this.clock = new THREE.Clock();

        // Managers
        this.input = new InputManager(this.canvas);
        this.sound = new SoundManager();
        this.ui = new UIManager();

        // Game objects (created on start)
        this.level = null;
        this.player = null;
        this.weapon = null;
        this.doors = [];
        this.enemyManager = null;

        // Wall hit marks
        this.hitMarks = [];

        // Screen shake from damage
        this.damageFlashTimer = 0;

        this.setupEvents();
        this.ui.showScreen('menu');
        this.loop();
    }

    setupEvents() {
        document.getElementById('deployBtn').addEventListener('click', () => this.startGame());
        document.getElementById('retryBtn').addEventListener('click', () => this.startGame());
        document.getElementById('victoryBtn').addEventListener('click', () => {
            this.state = GAME_STATE.MENU;
            this.ui.showScreen('menu');
            this.ui.hideGameUI();
            if (document.pointerLockElement) document.exitPointerLock();
        });

        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    startGame() {
        this.state = GAME_STATE.PLAYING;
        this.ui.hideAllScreens();
        this.ui.showGameUI();
        this.ui.setBloodVignette(0);
        this.sound.stopHeartbeat();
        if (this.sound.ambientSrc) {
            try { this.sound.ambientSrc.stop(); } catch(e) {}
            this.sound.ambientSrc = null;
        }

        // Reset scene
        while (this.scene.children.length > 0) {
            this.scene.remove(this.scene.children[0]);
        }
        // Clear camera children (old weapon)
        while (this.camera.children.length > 0) {
            this.camera.remove(this.camera.children[0]);
        }
        this.scene.add(this.camera);
        this.scene.fog = null;

        // Build level
        this.level = new Level(this.scene);

        // Create player
        this.player = new Player(this.camera, this.input);

        // Create weapon
        this.weapon = new Weapon(this.camera);

        // Create doors
        this.doors = [];
        for (const dp of this.level.doorPositions) {
            const door = new Door(this.scene, { x: dp.x, z: dp.z }, dp.side, dp.index);
            this.doors.push(door);
        }

        // Create enemies
        this.enemyManager = new EnemyManager(this.scene, this.level.doorPositions);

        // Hit marks array
        this.hitMarks = [];
        this.damageFlashTimer = 0;

        // Request pointer lock
        this.input.requestLock();

        // Start ambient sound
        this.sound.ensure();
        this.sound.playAmbient();

        this.ui.updateKillCounter(0);
    }

    damagePlayer() {
        if (this.state !== GAME_STATE.PLAYING) return;
        this.player.hp--;
        this.sound.playPlayerHit();
        this.ui.screenShake(1.0);
        this.damageFlashTimer = 0.5;

        if (this.player.hp <= 0) {
            // Death
            this.state = GAME_STATE.DEAD;
            this.sound.stopHeartbeat();
            this.ui.setBloodVignette(1.0);
            setTimeout(() => {
                this.ui.showScreen('death');
                this.ui.hideGameUI();
                if (document.pointerLockElement) document.exitPointerLock();
            }, 1000);
        } else {
            // Wounded
            this.ui.setBloodVignette(0.6);
            this.sound.startHeartbeat();
        }
    }

    handleShooting() {
        if (!this.input.leftJustPressed) return;
        this.input.leftJustPressed = false;
        if (!this.weapon.shoot(this.sound)) return;

        // Screen shake
        this.ui.screenShake(0.3);

        // 8-pellet shotgun spread
        const spread = this.weapon.getSpreadAngle();
        const pelletCount = 8;
        let hitEnemy = false;

        // Track which enemies were already damaged THIS shot (prevent 8-pellet = 8 damage)
        const damagedThisShot = new Set();

        // Notify enemies of sound
        this.enemyManager.notifySound(
            this.player.position.x,
            this.player.position.z,
            20,
            this.sound
        );

        const camDir = new THREE.Vector3();
        this.camera.getWorldDirection(camDir);

        for (let i = 0; i < pelletCount; i++) {
            const pelletDir = camDir.clone();
            pelletDir.x += (Math.random() - 0.5) * spread;
            pelletDir.y += (Math.random() - 0.5) * spread;
            pelletDir.z += (Math.random() - 0.5) * spread;
            pelletDir.normalize();

            const ray = new THREE.Raycaster(
                this.camera.position.clone(),
                pelletDir,
                0.1,
                50
            );

            // Check enemy hits
            const enemyHits = this.enemyManager.checkHits(ray);
            if (enemyHits.length > 0) {
                const hit = enemyHits[0];
                // Only deal damage once per enemy per shot
                if (!damagedThisShot.has(hit.enemy)) {
                    damagedThisShot.add(hit.enemy);
                    const killed = hit.enemy.takeDamage(
                        this.sound,
                        pelletDir.clone(),
                        this.level ? this.level.colliders : null
                    );
                    if (killed) {
                        this.enemyManager.killCount++;
                        this.ui.updateKillCounter(this.enemyManager.killCount);
                    }
                }
                hitEnemy = true;
                continue;
            }

            // Check wall hits (scene intersect)
            const intersects = ray.intersectObjects(this.scene.children, true);
            if (intersects.length > 0) {
                // Skip weapon and enemy meshes
                let wallHit = null;
                for (const inter of intersects) {
                    let skip = false;
                    let obj = inter.object;
                    while (obj) {
                        if (obj === this.weapon.group) { skip = true; break; }
                        for (const e of this.enemyManager.enemies) {
                            if (obj === e.group) { skip = true; break; }
                        }
                        if (skip) break;
                        obj = obj.parent;
                    }
                    if (!skip) { wallHit = inter; break; }
                }
                if (wallHit && wallHit.point) {
                    this.addHitMark(wallHit.point, wallHit.face ? wallHit.face.normal : new THREE.Vector3(0, 0, 1));
                }
            }
        }
    }

    addHitMark(position, normal) {
        const geo = new THREE.PlaneGeometry(0.05, 0.05);
        const mat = new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.8, depthWrite: false });
        const mark = new THREE.Mesh(geo, mat);
        mark.position.copy(position);
        mark.position.addScaledVector(normal, 0.01);
        mark.lookAt(position.clone().add(normal));
        this.scene.add(mark);
        this.hitMarks.push({ mesh: mark, life: 5 });

        // Limit hit marks
        if (this.hitMarks.length > 50) {
            const old = this.hitMarks.shift();
            this.scene.remove(old.mesh);
        }
    }

    checkVictory() {
        if (this.enemyManager.killCount >= 10) {
            // Check if player is near spawn
            const dx = this.player.position.x;
            const dz = this.player.position.z - 1;
            if (Math.sqrt(dx * dx + dz * dz) < 2) {
                this.state = GAME_STATE.VICTORY;
                this.sound.stopHeartbeat();
                this.ui.showScreen('victory');
                this.ui.hideGameUI();
                if (document.pointerLockElement) document.exitPointerLock();
            }
        }
    }

    update(dt) {
        if (this.state !== GAME_STATE.PLAYING) return;
        if (dt > 0.1) dt = 0.1; // Clamp delta

        // Gather all colliders including doors
        const allColliders = [...this.level.colliders];
        for (const door of this.doors) {
            const col = door.getCollider();
            if (col) allColliders.push(col);
        }

        // Player update
        this.player.update(dt, allColliders, this.sound);

        // Weapon update
        this.weapon.update(dt, this.input.mouseDown.right, this.sound);

        // Weapon sway
        if (this.player.isMoving) {
            const sway = Math.sin(this.player.bobTimer * 0.7) * 0.005;
            this.weapon.group.position.x += sway;
        }

        // Shooting
        this.handleShooting();

        // Reload
        if (this.input.wasPressed('KeyR')) {
            this.weapon.startReload(this.sound);
        }

        // Door interaction
        let nearDoor = null;
        for (const door of this.doors) {
            door.update(dt);
            if (!door.isOpen && door.isNear(this.player.position.x, this.player.position.z, 2.0)) {
                nearDoor = door;
            }
        }

        this.ui.showInteraction(nearDoor !== null);

        if (nearDoor && this.input.wasPressed('KeyF')) {
            nearDoor.kick(this.sound);
            // Notify enemies
            this.enemyManager.notifySound(
                nearDoor.position.x,
                nearDoor.position.z,
                15,
                this.sound
            );
        }

        // Enemy update
        this.enemyManager.update(dt, this.player.getPosition3(), this, this.doors, allColliders);

        // Damage flash
        if (this.damageFlashTimer > 0) {
            this.damageFlashTimer -= dt;
        }

        // Blood vignette pulse when wounded
        if (this.player.hp === 1) {
            const pulse = 0.4 + Math.sin(Date.now() * 0.003) * 0.15;
            this.ui.setBloodVignette(pulse);
        }

        // Hit mark lifetime
        for (let i = this.hitMarks.length - 1; i >= 0; i--) {
            this.hitMarks[i].life -= dt;
            if (this.hitMarks[i].life <= 0) {
                this.scene.remove(this.hitMarks[i].mesh);
                this.hitMarks.splice(i, 1);
            }
        }

        // Light flickering
        if (this.level.lights.length > 0) {
            for (const light of this.level.lights) {
                light.intensity += (Math.random() - 0.5) * 0.02;
                light.intensity = Math.max(0.2, Math.min(0.8, light.intensity));
            }
        }

        // Film grain animation
        const grain = document.getElementById('filmGrain');
        if (grain) {
            grain.style.transform = `translate(${(Math.random()-0.5)*4}px, ${(Math.random()-0.5)*4}px)`;
        }

        // Screen shake
        this.ui.updateShake(dt);

        // Victory check
        this.checkVictory();
    }

    loop() {
        const dt = this.clock.getDelta();
        this.update(dt);
        this.renderer.render(this.scene, this.camera);
        this.input.clearFrame();
        requestAnimationFrame(() => this.loop());
    }
}

// ============================================================
// Start
// ============================================================
const game = new Game();
</script>
