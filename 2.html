<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Player Wounded State - Tactical FPS</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec7f13",
                        "background-light": "#f8f7f6",
                        "background-dark": "#221910",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom vignette for the wounded effect */
        .blood-vignette {
            background: radial-gradient(circle, transparent 40%, rgba(139, 0, 0, 0.4) 70%, rgba(80, 0, 0, 0.85) 90%, rgba(40, 0, 0, 0.95) 100%);
            box-shadow: inset 0 0 150px rgba(255, 0, 0, 0.3);
            pointer-events: none;
        }
        
        /* Blur effect for disorientation */
        .disorientation-blur {
            backdrop-filter: blur(2px) contrast(1.1);
        }

        /* Subtle noise texture overlay */
        .noise-overlay {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.15;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 overflow-hidden h-screen w-screen m-0 p-0">
<!-- Game Viewport Container -->
<div class="relative w-full h-full bg-black">
<!-- Main Game Scene (Background Layer) -->
<div class="absolute inset-0 w-full h-full">
<!-- Background Environment: Gritty urban warehouse or alleyway -->
<div class="w-full h-full bg-cover bg-center bg-no-repeat scale-105" data-alt="Dark gritty industrial warehouse interior with dust particles" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCtIY6hIecKdSyvPbJIKD3omgoLqTY00Qip2L3eAj8ZT6qY6IPgwiKznw_9wegiIp6IePrqnWA6hWS-ktQEK7vD3W3zJKMP3vRYcAh4HEBnKt0tFTKPFR6VC3b784hCWBiZ2L9PHxTpgTqWphXF3--A51dEL2aE1qjbDS-fM67fOuKfVwIJOPfPhx_UyBjkuNEPVMyLakweDM_8-6sLc04Gtiwt463tTzk0pH31qhNPN2p4wURwGrw25YAPA5pwenVu78loyH1C7a0');">
<div class="absolute inset-0 bg-black/40"></div>
</div>
<!-- Enemy Ragdoll (Simulated at distance) -->
<div class="absolute top-[45%] left-[55%] w-32 h-48 opacity-90 transform -rotate-12 blur-[1px]">
<!-- Using an image to represent the enemy falling -->
<div class="w-full h-full bg-contain bg-center bg-no-repeat grayscale brightness-50 contrast-125" data-alt="Silhouette of a soldier falling backward" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCcrVSuxan4kfUYTBU5iXSqzYYMtTJmRT6OR0_CTQGvkO2r_jubazKofPqAR-uRx-G_8X__o-UjANl14ijFRTWzgS4Bd6LRjqz0yC98OI3hozwr5E1YAm0A2qhfyrPsrIrFbz37TxDnBA2MoJaWxMZpQakeafn3G-FzIapKbAxTpCpINdVRoR_3xSUx5XbkjLDA6OBNiMPl8gPLYpNLlYHfo-mUQg9nsmU6Gu_TrTurJxoliFy2Uo1f2sCWqCug6kcm0cBhLlaLgxA'); mask-image: linear-gradient(to bottom, black 50%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);">
</div>
</div>
<!-- First Person Weapon View -->
<div class="absolute bottom-0 right-0 w-full h-full flex justify-end items-end pointer-events-none">
<!-- Shotgun Image positioned to look like FPS view -->
<div class="w-[600px] h-[500px] bg-contain bg-right-bottom bg-no-repeat translate-x-20 translate-y-10 rotate-3 brightness-75 contrast-125 sepia-[.3]" data-alt="First person perspective holding a tactical shotgun" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBtnVP8QeO7tHWk-VF6wc4PAAFa0347doyekIZKIYlKR4wj59wSZz0wYfcrZ3aAyzCeGNUOfT03EC4EDkHFS5md_1JUIKu_mO92W7T-NjdKpTpbGVUGQ40q68BPbG7hQXF4k1aRvkQAmjHafS-ry_Cza2Lf2man2aG1Q-IcACiZX_gegcePL3bC2utsgenDp_ETmkieLFwN5EBBrlvdeuwxr-7DDs1t9yDF6mahM8jtIM0qiBOc56stFwD4yacH4WoQ9b94ysfJTsY');">
</div>
</div>
</div>
<!-- Post-Processing / FX Layers -->
<!-- 1. Disorientation Blur (Center clear-ish, edges blurry) -->
<div class="absolute inset-0 disorientation-blur mix-blend-overlay opacity-30"></div>
<!-- 2. Blood Vignette (Pulsing Wounded Effect) -->
<div class="absolute inset-0 blood-vignette animate-pulse-slow"></div>
<!-- 3. Red Color Grading Overlay (Simulate blood loss/adrenaline) -->
<div class="absolute inset-0 bg-red-900/20 mix-blend-overlay pointer-events-none"></div>
<!-- 4. Noise Grain -->
<div class="absolute inset-0 noise-overlay"></div>
<!-- Minimal Diegetic Feedback -->
<!-- Just a very subtle "Critical" hint, almost invisible, relying on the visual red pulse -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-full h-full relative">
<!-- Blood spatters on 'lens' -->
<div class="absolute top-10 left-20 w-32 h-32 bg-red-900/60 rounded-full blur-xl mix-blend-multiply opacity-60"></div>
<div class="absolute bottom-40 right-10 w-24 h-24 bg-red-900/50 rounded-full blur-lg mix-blend-multiply opacity-50"></div>
<div class="absolute top-1/2 left-10 w-16 h-48 bg-red-900/40 -rotate-45 blur-2xl mix-blend-multiply opacity-40"></div>
</div>
</div>
<!-- Settings / Pause Hint (Hidden UI, only visible on hover for UX, practically invisible in scene) -->
<div class="absolute top-6 right-6 opacity-0 hover:opacity-100 transition-opacity duration-300">
<button class="bg-black/50 text-white p-2 rounded-full backdrop-blur-md border border-white/10 hover:bg-primary/80">
<span class="material-symbols-outlined text-2xl" data-icon="pause">pause</span>
</button>
</div>
<!-- Simulated "HUD" elements that are failing/glitching out -->
<!-- Crosshair (Faded) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none opacity-40">
<div class="relative w-8 h-8 flex items-center justify-center">
<div class="w-1 h-1 bg-white/80 rounded-full shadow-[0_0_10px_rgba(255,255,255,0.8)]"></div>
<div class="absolute w-full h-[1px] bg-white/20"></div>
<div class="absolute h-full w-[1px] bg-white/20"></div>
</div>
</div>
</div>
</body></html>
